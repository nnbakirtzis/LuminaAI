<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Careers - AI Job Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Manrope', 'sans-serif'], // Geometric sans for headings
            },
            colors: {
              navy: {
                50: '#F0F4F8',
                100: '#D9E2EC',
                200: '#BCCCDC',
                300: '#9FB3C8',
                400: '#829AB1',
                500: '#627D98',
                600: '#486581',
                700: '#334E68',
                800: '#243B53',
                900: '#001F3F', // Primary Navy
                950: '#001123',
              },
              teal: {
                50: '#F0FAFA',
                100: '#C8EBEB',
                400: '#4FD1C5',
                500: '#008080', // Success Teal
                600: '#006666',
                700: '#004D4D',
              },
              gold: {
                50: '#FBF8F3',
                100: '#F5EFE4',
                200: '#EADBC2',
                300: '#DFC6A0',
                400: '#D4B17D',
                500: '#D4AF37', // Subtle Luxury Gold
                600: '#A17D48',
                700: '#795D36',
                800: '#503E24',
                900: '#281F12',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.6s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
